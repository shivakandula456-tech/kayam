<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | KAYAM SPICES Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#173D2C">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body admin-booting" data-admin-page="orders">
  <div class="admin-boot" id="admin-boot">
    <div class="admin-boot__panel">
      <img src="../assets/images/kayam-logo-mark.jpg" alt="" width="68" height="74">
      <span class="admin-spinner" aria-hidden="true"></span>
      <strong>Opening your workspace</strong>
      <p>Checking administrator access…</p>
    </div>
  </div>
  <div class="admin-layout" id="admin-layout" hidden>
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-workspace">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-main" id="admin-main">
        <header class="admin-page-head">
          <div class="admin-page-head__copy">
            <p class="admin-eyebrow">Order management</p>
            <h1>Orders.</h1>
            <p>Review saved orders, set delivery charges, and move each order through confirmation.</p>
          </div>
          <div class="admin-actions">
            <button class="admin-btn admin-btn--outline" type="button" id="orders-refresh">Refresh</button>
          </div>
        </header>

        <div id="orders-error"></div>
        <form class="admin-filters" id="orders-filters" role="search">
          <div class="admin-filters__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.2 4.2"/></svg>
            <label class="sr-only" for="orders-search">Search orders</label>
            <input class="admin-input" id="orders-search" name="search" type="search" placeholder="Reference, customer name, or phone">
          </div>
          <div>
            <label class="sr-only" for="orders-status">Filter by status</label>
            <select class="admin-select" id="orders-status" name="status">
              <option value="">All statuses</option>
              <option value="pending_confirmation">Pending confirmation</option>
              <option value="confirmed">Confirmed</option>
              <option value="processing">Processing</option>
              <option value="dispatched">Dispatched</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <button class="admin-btn" type="submit">Apply</button>
        </form>

        <section class="admin-card" aria-labelledby="orders-list-title">
          <div class="admin-card__head">
            <div>
              <h2 id="orders-list-title">Saved orders</h2>
              <p id="orders-summary">Loading orders…</p>
            </div>
          </div>
          <div id="orders-list">
            <div class="admin-loading">Loading orders…</div>
          </div>
          <div class="admin-pagination" id="orders-pagination" hidden></div>
        </section>
      </main>
    </div>
  </div>

  <dialog class="admin-dialog" id="order-dialog" aria-labelledby="order-dialog-title">
    <div class="admin-dialog__head">
      <div>
        <h2 id="order-dialog-title">Order details</h2>
        <p id="order-dialog-subtitle">Loading saved order…</p>
      </div>
      <button class="admin-dialog__close" type="button" data-close-order aria-label="Close order details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="admin-dialog__body" id="order-dialog-body">
      <div class="admin-loading">Loading saved order…</div>
    </div>
  </dialog>

  <button class="admin-scrim" type="button" aria-label="Close admin navigation"></button>
  <div class="admin-toast-stack" aria-live="polite"></div>
  <noscript><p style="padding: 2rem;">Administrator tools require JavaScript.</p></noscript>
  <script defer src="../assets/js/config.js"></script>
  <script defer src="../assets/vendor/supabase.js"></script>
  <script defer src="../assets/js/supabase-client.js"></script>
  <script defer src="../assets/js/admin.js"></script>
  <script defer src="../assets/js/admin-orders.js"></script>
</body>
</html>
